# 發版：推 v<版本> 標籤（要跟 source.json 的 version 一樣）就在 GitHub 上編 Windows 與 Mac 兩個執行檔、打包 zip、發 Release。
# Mac（Apple 晶片）的執行檔只能在 Mac 上編，所以分兩段：macos 先編好傳給 windows，windows 跑 pack.mjs 打包。
# catalog.json 不在這裡改：Release 好了之後確認 zip 再手動更新（SHA-256 與大小印在這次執行的 Summary）。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add aarch64-apple-darwin
      - run: cargo build --release --target aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: mac-bin
          path: target/aarch64-apple-darwin/release/source-youtube
          if-no-files-found: error

  pack:
    needs: mac
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mac-bin
          path: dist/mac
      - name: 標籤要跟 source.json 的版本一樣
        shell: pwsh
        run: |
          $v = (Get-Content source.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne "${{ github.ref_name }}") { throw "標籤 ${{ github.ref_name }} 跟 source.json 的 $v 不一樣" }
          "VERSION=$v" >> $env:GITHUB_ENV
      - name: 打包
        shell: pwsh
        run: |
          Move-Item dist/mac/source-youtube dist/mac/source-youtube-macos
          node pack.mjs
      - name: 發 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "dist/any-kareokie-source-youtube-$env:VERSION.zip"
          $notes = "release-notes/$env:VERSION.md"
          if (-not (Test-Path $notes)) { throw "找不到 $notes" }
          gh release create "${{ github.ref_name }}" $zip --title "YouTube 匯入來源 $env:VERSION" --notes-file $notes
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $zip).Length
          "## catalog.json`n`n- sha256: ``$hash```n- size: $size" >> $env:GITHUB_STEP_SUMMARY
